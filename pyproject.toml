[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ratis-net"
version = "0.2.0"
description = "RATIS-Net — neural network trained by the Law of Topological Coherence (LCT), no gradient descent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary — JOHNKING0 & Jonathan Evina (see LICENSE)" }
authors = [
    { name = "Jonathan Evina", email = "evinajonathan13@gmail.com" },
    { name = "JOHNKING0" },
]
keywords = ["LCT", "topological-coherence", "neurogenesis", "no-gradient",
            "cognitive-architecture"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24,<3.0",
]

[project.optional-dependencies]
full = [
    "scipy>=1.11,<2.0",
    "gudhi>=3.9",
]
train = [
    "datasets>=2.14",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
ratisnet = "ratis_net.cli:main"
ratisnet-serve = "ratis_net.server:main"

[project.urls]
Homepage = "https://github.com/evinajonathan13-max/Ratiss-experimental-IA-"
Repository = "https://github.com/evinajonathan13-max/Ratiss-experimental-IA-"

[tool.setuptools]
packages = ["ratis_net", "ratis_net.lct_modules"]
include-package-data = true

[tool.setuptools.package-data]
ratis_net = ["*.json", "static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
