<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RATIS-Net — Chat</title>
<style>
  :root {
    --bg: #0b1020; --panel: #131c3a; --border: #2a3a66;
    --text: #e8edff; --muted: #8fa3d0; --accent: #4f7cff; --green: #22c55e;
    --gold: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Inter, system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 70% -10%, #16224a 0%, var(--bg) 55%);
    color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 22px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px; background: rgba(11,16,32,.85);
  }
  .logo {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #7b5cff);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px; color: #fff;
  }
  header h1 { font-size: 17px; font-weight: 700; }
  header .sub { font-size: 11.5px; color: var(--muted); }
  .badge {
    margin-left: auto; font-size: 11px; color: var(--green);
    border: 1px solid #1f7a54; border-radius: 20px; padding: 4px 12px;
    white-space: nowrap;
  }
  #stats { font-size: 11px; color: var(--muted); margin-top: 2px; }
  main { flex: 1; overflow-y: auto; padding: 22px; }
  #chat { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 82%; padding: 12px 16px; border-radius: 14px; line-height: 1.55;
         font-size: 14.5px; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: linear-gradient(135deg, #25418f, var(--accent));
          border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border);
         border-bottom-left-radius: 4px; }
  .bot .facts { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border);
                font-size: 12.5px; color: #bfe9d2; }
  .bot .facts .f { margin: 4px 0; }
  .bot .facts .f::before { content: "✓ "; color: var(--green); font-weight: 700; }
  .bot .meta { margin-top: 8px; font-size: 11px; color: var(--muted); }
  .bot .meta code { color: var(--gold); font-size: 10.5px; }
  .typing { align-self: flex-start; color: var(--muted); font-size: 13px;
            padding: 8px 4px; font-style: italic; }
  form {
    padding: 14px 22px 18px; border-top: 1px solid var(--border);
    background: rgba(11,16,32,.9);
  }
  .row { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; }
  input[type=text] {
    flex: 1; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 13px 16px; color: var(--text); font-size: 14.5px;
    outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    background: linear-gradient(135deg, var(--accent), #7b5cff); color: #fff;
    border: none; border-radius: 12px; padding: 0 22px; font-size: 15px;
    font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .chip {
    font-size: 12px; color: var(--muted); border: 1px solid var(--border);
    border-radius: 18px; padding: 5px 12px; cursor: pointer; background: transparent;
    font-weight: 400;
  }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .chips { max-width: 820px; margin: 0 auto 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .hint { max-width: 820px; margin: 8px auto 0; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="logo">R</div>
  <div>
    <h1>RATIS-Net</h1>
    <div class="sub">Réseau entraîné par la Loi de Cohérence Topologique (LCT) — sans gradient</div>
    <div id="stats">chargement…</div>
  </div>
  <div class="badge" id="status">● connexion…</div>
</header>
<main><div id="chat"></div></main>
<form id="f">
  <div class="chips" id="chips"></div>
  <div class="row">
    <input type="text" id="q" placeholder="Écris à RATIS-Net… (français ou anglais)" autocomplete="off" autofocus>
    <button type="submit" id="send">Envoyer</button>
  </div>
  <div class="hint">Honnêteté : les faits proviennent de bases validées, le reste est reconstruction par corrélations — corrélation ≠ vérité.</div>
</form>
<script>
const chat = document.getElementById('chat');
const q = document.getElementById('q');
const send = document.getElementById('send');

const suggestions = [
  "hello, how are you?",
  "what is your name?",
  "qu'est-ce qu'un trou noir ?",
  "what is a black hole",
  "what is quantum mechanics",
  "qu'est-ce que la photosynthèse ?",
  "how does DNA work",
  "what is a protein",
  "explain consciousness",
  "merci beaucoup !",
];
const chips = document.getElementById('chips');
for (const s of suggestions) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'chip'; b.textContent = s;
  b.onclick = () => { q.value = s; q.focus(); };
  chips.appendChild(b);
}

function addMsg(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollIntoView({behavior: 'smooth', block: 'end'});
  return d;
}

async function health() {
  try {
    const r = await fetch('/health');
    const j = await r.json();
    document.getElementById('status').textContent = '● en ligne';
    document.getElementById('stats').textContent =
      j.scalpel_neurons.toLocaleString('fr') + ' neurones · ' +
      j.vocab_size.toLocaleString('fr') + ' mots · ' +
      j.knowledge_packs + ' packs de connaissances';
  } catch(e) {
    document.getElementById('status').textContent = '● hors ligne';
  }
}

document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const text = q.value.trim();
  if (!text) return;
  addMsg('user', text);
  q.value = '';
  send.disabled = true;
  const t = addMsg('typing', 'RATIS-Net réfléchit…');
  try {
    const r = await fetch('/science', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({q: text})
    });
    const j = await r.json();
    t.remove();
    const d = addMsg('bot', j.sentence || j.error || '—');
    if (j.knowledge_facts && j.knowledge_facts.length) {
      const fd = document.createElement('div');
      fd.className = 'facts';
      for (const f of j.knowledge_facts.slice(0, 3)) {
        const p = document.createElement('div');
        p.className = 'f'; p.textContent = f.text;
        fd.appendChild(p);
      }
      d.appendChild(fd);
    }
    const meta = document.createElement('div');
    meta.className = 'meta';
    const concepts = (j.concepts || []).slice(0, 6).join(', ');
    meta.textContent = concepts ? 'concepts : ' + concepts : '';
    if (concepts) d.appendChild(meta);
    chat.scrollIntoView({behavior: 'smooth', block: 'end'});
  } catch(err) {
    t.textContent = 'Erreur de connexion : ' + err.message;
  }
  send.disabled = false;
  q.focus();
};

addMsg('bot', "Bonjour — je suis RATIS-Net. Pose-moi une question scientifique (j'ai des faits vérifiés sur la physique quantique, l'astronomie, la chimie, la médecine, la biologie, les maths et l'IA), ou discute simplement. Je réponds en français et en anglais.");
health();
</script>
</body>
</html>
