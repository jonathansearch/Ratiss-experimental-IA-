<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <marker id="arr3" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="980" height="460" rx="18" fill="url(#bg3)"/>
  <text x="40" y="52" fill="#e8edff" font-size="26" font-weight="700">Tests de langage — avant / après la reconstruction</text>
  <text x="40" y="78" fill="#8fa3d0" font-size="14">Même checkpoint Scalpel, même loi LCT — seule la lecture du réseau a changé</text>

  <!-- colonnes -->
  <rect x="40" y="110" width="430" height="300" rx="14" fill="#1b2547" stroke="#7a2d3b"/>
  <text x="255" y="140" fill="#ff9aa8" font-size="15" font-weight="700" text-anchor="middle">AVANT — v1 (poids bruts)</text>
  <text x="60" y="172" fill="#c9d4f5" font-size="12">Q : hello, how are you?</text>
  <text x="60" y="190" fill="#ff9aa8" font-size="12" font-style="italic">→ gabarit scientifique générique</text>
  <text x="60" y="216" fill="#c9d4f5" font-size="12">Q : what is a black hole</text>
  <text x="60" y="234" fill="#ff9aa8" font-size="12" font-style="italic">→ « metal, american, comedy »</text>
  <text x="60" y="260" fill="#c9d4f5" font-size="12">Q : qu'est-ce que la photosynthèse</text>
  <text x="60" y="278" fill="#ff9aa8" font-size="12" font-style="italic">→ gabarit anglais, accents cassés</text>
  <text x="60" y="304" fill="#c9d4f5" font-size="12">conversation_matrix (24 000)</text>
  <text x="60" y="322" fill="#ff9aa8" font-size="12" font-style="italic">→ 0 chargée (clé lue : « contexts »)</text>
  <text x="60" y="348" fill="#c9d4f5" font-size="12">tests collectables</text>
  <text x="60" y="366" fill="#ff9aa8" font-size="12" font-style="italic">→ 21, plus un fichier qui casse pytest</text>

  <line x1="482" y1="260" x2="520" y2="260" stroke="#22c55e" stroke-width="3" marker-end="url(#arr3)"/>

  <rect x="530" y="110" width="410" height="300" rx="14" fill="#13251f" stroke="#1f7a54"/>
  <text x="735" y="140" fill="#7ddeb0" font-size="15" font-weight="700" text-anchor="middle">APRÈS — v2 (routage + IDF + GloVe)</text>
  <text x="550" y="172" fill="#c9d4f5" font-size="12">Q : hello, how are you?</text>
  <text x="550" y="190" fill="#7ddeb0" font-size="12" font-style="italic">→ « Hello my friend. How do you feel… »</text>
  <text x="550" y="216" fill="#c9d4f5" font-size="12">Q : what is a black hole</text>
  <text x="550" y="234" fill="#7ddeb0" font-size="12" font-style="italic">→ fait vérifié NASA : horizon des événements</text>
  <text x="550" y="260" fill="#c9d4f5" font-size="12">Q : qu'est-ce que la photosynthèse</text>
  <text x="550" y="278" fill="#7ddeb0" font-size="12" font-style="italic">→ fait vérifié en français, accents corrects</text>
  <text x="550" y="304" fill="#c9d4f5" font-size="12">conversation_matrix (24 000)</text>
  <text x="550" y="322" fill="#7ddeb0" font-size="12" font-style="italic">→ chargées et routées (salutations, merci…)</text>
  <text x="550" y="348" fill="#c9d4f5" font-size="12">tests</text>
  <text x="550" y="366" fill="#7ddeb0" font-size="12" font-style="italic">→ 57 / 57 verts, dont 30 nouveaux</text>

  <text x="490" y="440" fill="#8fa3d0" font-size="12" text-anchor="middle">Pipeline complet mesuré : chargement 17,6 s · 242 903 mots indexés · 7 packs de connaissances · empreinte SHA-256 par réponse</text>
</svg>
